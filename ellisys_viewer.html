function buildTimeline() {
  const sc=getStreamCol(),ecCol=detectedFields.eventCounter,dc=getDirCol();
  if(sc===null||ecCol===undefined){document.getElementById('tlToolbar').innerHTML='<span style="color:#8b949e;">Timeline requires CIS/BIS ID and Event Counter.</span>';return;}

  let tb=`<div class="tl-mode-group">`;
  tb+=`<button class="tl-mode-btn${tlMode==='grid'?' active':''}" data-mode="grid">ISO Event Grid</button>`;
  tb+=`<button class="tl-mode-btn${tlMode==='rssi'?' active':''}" data-mode="rssi">RSSI</button>`;
  tb+=`<button class="tl-mode-btn${tlMode==='channel'?' active':''}" data-mode="channel">Channel</button>`;
  tb+=`<button class="tl-mode-btn${tlMode==='pairing'?' active':''}" data-mode="pairing">Packet Pairing</button>`;
  tb+=`<button class="tl-mode-btn${tlMode==='timing'?' active':''}" data-mode="timing" title="앵커 간격과 Subevent 송신 시각의 편차 (µs)">Timing β</button>`;
  tb+=`</div>`;
  tb+=`<button class="btn btn-sm" id="btnTlReset">Reset Zoom</button>`;
  tb+=`<button class="btn btn-sm" id="btnTlSelApply" style="display:none;">Filter Selection → Table</button>`;
  tb+=`<div class="tl-legend" id="tlLegend"></div>`;
  tb+=`<span class="tl-info">Scroll=zoom · Drag=pan · Shift+drag=select</span>`;
  document.getElementById('tlToolbar').innerHTML=tb;

  // Mode buttons
  document.querySelectorAll('.tl-mode-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      tlMode=btn.dataset.mode;
      document.querySelectorAll('.tl-mode-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      tlZoom=1;tlPanX=0;drawTimeline();
    });
  });

  document.getElementById('btnTlReset').onclick=()=>{tlZoom=1;tlPanX=0;tlSelActive=false;document.getElementById('tlSelection').classList.remove('active');document.getElementById('btnTlSelApply').style.display='none';drawTimeline();};
  document.getElementById('btnTlSelApply').onclick=()=>{
    if(!tlSelActive)return;
    const wrap=document.getElementById('tlCanvasWrap'),cW=wrap.clientWidth,labelW=120,pad=20;
    const chartW=(cW-labelW-pad*2)*tlZoom;
    const vis=getVisibleData(),allC=vis.map(r=>parseInt(r[ecCol])).filter(v=>!isNaN(v));
    const minC=Math.min(...allC),maxC=Math.max(...allC),range=maxC-minC||1;
    const x1=Math.min(tlSelStartX,tlSelEndX),x2=Math.max(tlSelStartX,tlSelEndX);
    const c1=minC+((x1-labelW-pad+tlPanX)/chartW)*range,c2=minC+((x2-labelW-pad+tlPanX)/chartW)*range;
    const allowed=new Set();rawData.forEach(r=>{const v=parseInt(r[ecCol]);if(!isNaN(v)&&v>=Math.floor(c1)&&v<=Math.ceil(c2))allowed.add(r[ecCol]);});
    if(allowed.size>0){columnFilters[ecCol]=allowed;updateFilterInd();applyFilters();switchTab('table');}
  };

  tlZoom=1;tlPanX=0;
  drawTimeline();
  if(!tlEventsSetup){setupTimelineEvents();tlEventsSetup=true;}
}

function drawTimeline() {
  const lg=document.getElementById('tlLegend'); if(lg&&tlMode!=='grid'&&tlMode!=='timing') lg.innerHTML='';
  if (tlMode === 'grid') { drawTimelineGrid(); return; }
  if (tlMode === 'pairing') { drawTimelinePairing(); return; }
  if (tlMode === 'timing') { drawTimelineTiming(); return; }
  // RSSI or Channel mode: X=Timestamp, Y=RSSI or Channel, per stream+direction
  const wrap=document.getElementById('tlCanvasWrap');
  const canvas=document.getElementById('tlCanvas');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const cW=wrap.clientWidth,cH=wrap.clientHeight||400;
  canvas.width=cW*dpr;canvas.height=cH*dpr;canvas.style.width=cW+'px';canvas.style.height=cH+'px';ctx.scale(dpr,dpr);

  tlHitBoxes=[];
  const sc=getStreamCol(),ecCol=detectedFields.eventCounter,dc=getDirCol(),tsCol=detectedFields.timestamp;
  const yCol = tlMode==='rssi' ? detectedFields.rssi : detectedFields.channel;
  const yLabel = tlMode==='rssi' ? 'RSSI (dBm)' : 'Channel';
  const vis=getVisibleData();
  if(vis.length===0||yCol===undefined){ctx.fillStyle='#8b949e';ctx.font='14px Segoe UI';ctx.fillText(yCol===undefined?`No ${yLabel} column detected`:'No visible packets',cW/2-80,cH/2);return;}

  // Parse X values (timestamp) and Y values
  const parsed=[];
  vis.forEach((r,vi)=>{
    const oi=vis._oi[vi];
    let xVal;
    if(tsCol!==undefined){
      xVal=parseFloat(r[tsCol].replace(/[^0-9.\-]/g,''));
      if(r[tsCol].includes('us')||r[tsCol].includes('µs')) xVal/=1000;
    } else {
      xVal=parseInt(r[ecCol])||0; // fallback to event counter
    }
    const yVal=parseFloat(r[yCol]);
    if(isNaN(xVal)||isNaN(yVal))return;
    parsed.push({x:xVal, y:yVal, sid:getStreamId(r), dir:dc!==undefined?r[dc]:null, ec:parseInt(r[ecCol])||0, oi, row:r, isErr:errorRows.has(oi)});
  });
  if(parsed.length===0)return;

  const labelW=60, pad=20, topPad=30, botPad=30;
  const chartW=(cW-labelW-pad*2)*tlZoom;
  const chartH=cH-topPad-botPad;

  const xMin=Math.min(...parsed.map(p=>p.x)),xMax=Math.max(...parsed.map(p=>p.x)),xRange=xMax-xMin||1;
  let yMin,yMax;
  if(tlMode==='rssi'){
    yMin=Math.min(...parsed.map(p=>p.y))-2; yMax=Math.max(...parsed.map(p=>p.y))+2;
  } else {
    yMin=Math.min(...parsed.map(p=>p.y))-1; yMax=Math.max(...parsed.map(p=>p.y))+1;
  }
  const yRange=yMax-yMin||1;

  // Background
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cW,cH);

  // Y axis grid + labels
  ctx.strokeStyle='#161b22';ctx.fillStyle='#484f58';ctx.font='10px Segoe UI';
  const ySteps = tlMode==='channel' ? Math.min(yRange,20) : 5;
  for(let i=0;i<=ySteps;i++){
    const yv=yMin+(yRange*i/ySteps);
    const py=topPad+chartH-(i/ySteps)*chartH;
    ctx.beginPath();ctx.moveTo(labelW,py);ctx.lineTo(cW,py);ctx.stroke();
    ctx.textAlign='right';ctx.fillText(tlMode==='channel'?Math.round(yv):yv.toFixed(0),labelW-4,py+3);
  }
  ctx.textAlign='left';

  // Y axis title
  ctx.save();ctx.translate(12,topPad+chartH/2);ctx.rotate(-Math.PI/2);
  ctx.fillStyle='#8b949e';ctx.font='11px Segoe UI';ctx.textAlign='center';ctx.fillText(yLabel,0,0);
  ctx.restore();ctx.textAlign='left';

  // Clip chart area
  ctx.save();ctx.beginPath();ctx.rect(labelW,topPad-5,cW-labelW,chartH+10);ctx.clip();

  // X axis grid
  const visXMin=xMin+(tlPanX/chartW)*xRange,visXMax=xMin+((tlPanX+cW-labelW)/chartW)*xRange;
  const xGridStep=Math.pow(10,Math.floor(Math.log10(Math.max(0.001,(visXMax-visXMin)/8))));
  const xGridStart=Math.floor(visXMin/xGridStep)*xGridStep;
  for(let g=xGridStart;g<=visXMax+xGridStep;g+=xGridStep){
    const px=labelW+pad+((g-xMin)/xRange)*chartW-tlPanX;
    if(px<labelW||px>cW)continue;
    ctx.strokeStyle='#161b22';ctx.beginPath();ctx.moveTo(px,topPad);ctx.lineTo(px,topPad+chartH);ctx.stroke();
  }

  // Draw connecting lines per stream+direction, then dots
  const groups={};
  parsed.forEach(p=>{const key=p.sid+'|'+(p.dir||'');if(!groups[key])groups[key]=[];groups[key].push(p);});

  for(const[key,pts]of Object.entries(groups)){
    const col=getColor(pts[0].sid,pts[0].dir);
    // Line
    ctx.strokeStyle=col.fg;ctx.lineWidth=1;ctx.globalAlpha=0.3;ctx.beginPath();
    let first=true;
    pts.forEach(p=>{
      const px=labelW+pad+((p.x-xMin)/xRange)*chartW-tlPanX;
      const py=topPad+chartH-((p.y-yMin)/yRange)*chartH;
      if(px<labelW-20||px>cW+20)return;
      if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
    });
    ctx.stroke();ctx.globalAlpha=1;

    // Dots
    pts.forEach(p=>{
      const px=labelW+pad+((p.x-xMin)/xRange)*chartW-tlPanX;
      const py=topPad+chartH-((p.y-yMin)/yRange)*chartH;
      if(px<labelW-5||px>cW+5)return;
      if(p.isErr){
        ctx.fillStyle='#f85149';ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#da3633';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.stroke();
      } else {
        ctx.fillStyle=col.fg;ctx.globalAlpha=0.8;
        ctx.beginPath();ctx.arc(px,py,Math.max(2,3/Math.sqrt(tlZoom)),0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
      }
      tlHitBoxes.push({x:px,y:py,r:5,origIdx:p.oi,sid:p.sid,dir:p.dir||'',ec:p.ec,isErr:p.isErr,hasGap:false,gap:null,row:p.row,yVal:p.y});
    });
  }

  ctx.restore(); // unclip

  // X axis labels
  ctx.fillStyle='#484f58';ctx.font='10px Segoe UI';
  for(let g=xGridStart;g<=visXMax+xGridStep;g+=xGridStep){
    const px=labelW+pad+((g-xMin)/xRange)*chartW-tlPanX;
    if(px<labelW||px>cW)continue;
    ctx.fillText(g.toFixed(1),px-12,cH-4);
  }
  ctx.fillStyle='#8b949e';ctx.font='10px Segoe UI';
  ctx.fillText(tsCol!==undefined?'Timestamp (ms) →':'Event Counter →',cW/2-40,cH-4);

  // Zoom indicator
  if(tlZoom>1){ctx.fillStyle='#484f58';ctx.font='10px Segoe UI';ctx.fillText(`Zoom: ${tlZoom.toFixed(1)}x`,cW-80,14);}

  // Legend (stream+direction)
  let lgX=labelW+pad+10,lgY=14;
  for(const[key,pts]of Object.entries(groups)){
    const col=getColor(pts[0].sid,pts[0].dir);
    ctx.fillStyle=col.fg;ctx.beginPath();ctx.arc(lgX,lgY,4,0,Math.PI*2);ctx.fill();
    const label=pts[0].sid+(pts[0].dir?' '+pts[0].dir:'');
    ctx.font='10px Segoe UI';ctx.fillText(label.length>20?label.substring(0,20)+'…':label,lgX+8,lgY+3);
    lgX+=ctx.measureText(label.length>20?label.substring(0,20)+'…':label).width+22;
    if(lgX>cW-100){lgX=labelW+pad+10;lgY+=14;}
  }
}

// ========== TIMING VIEW (beta) ==========
// X = Event Counter. Lines: each event's anchor-interval deviation from Δevent·ISO_Interval.
// Triangles: Subevent send times / reply gaps flagged by Slot Timing. Band = ± tolerance.
function drawTimelineTiming(){
  const wrap=document.getElementById('tlCanvasWrap'),canvas=document.getElementById('tlCanvas'),ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1,cW=wrap.clientWidth,cH=wrap.clientHeight||400;
  canvas.width=cW*dpr;canvas.height=cH*dpr;canvas.style.width=cW+'px';canvas.style.height=cH+'px';ctx.scale(dpr,dpr);
  tlHitBoxes=[];ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cW,cH);
  const sids=[...timingInfo.keys()].filter(s=>getStreamCol()===null||activeStreams.has(s));
  const lg=document.getElementById('tlLegend');
  const msg=t=>{if(lg)lg.innerHTML='';ctx.fillStyle='#8b949e';ctx.font='14px Segoe UI';ctx.textAlign='center';ctx.fillText(t,cW/2,cH/2);ctx.textAlign='left';};
  if(!timingInfo.size)return msg(detectedFields.timestamp===undefined?'Timestamp 컬럼이 없어 타이밍을 볼 수 없습니다 (상단 Columns에서 지정)':'타이밍을 계산할 수 있는 패킷이 없습니다');
  if(!sids.length)return msg('No visible streams');
  const tol=isoVal('tolUs');
  const pts=[],marks=[];
  sids.forEach(sid=>{const T=timingInfo.get(sid);T.anchors.forEach(a=>{if(a.dev!==null)pts.push({sid,...a});});T.flagged.forEach(m=>marks.push({sid,...m}));});
  const all=sids.flatMap(sid=>timingInfo.get(sid).anchors.map(a=>a.ec));
  if(!all.length)return msg('앵커를 찾을 수 없습니다 (C→P 패킷 필요)');
  let ecMin=Infinity,ecMax=-Infinity;all.forEach(e=>{if(e<ecMin)ecMin=e;if(e>ecMax)ecMax=e;});
  const labelW=60,pad=20,topPad=16,botPad=30,chartW=(cW-labelW-pad*2)*tlZoom,chartH=cH-topPad-botPad,range=ecMax-ecMin||1;
  const xOf=ec=>labelW+pad+(ec-ecMin)/range*chartW-tlPanX;
  let ext=tol*2;[...pts,...marks].forEach(p=>{ext=Math.max(ext,Math.abs(p.dev));});ext*=1.15;
  const yOf=v=>topPad+chartH/2-(v/ext)*(chartH/2);
  // Grid, tolerance band, zero line
  ctx.strokeStyle='#161b22';ctx.fillStyle='#484f58';ctx.font='10px Segoe UI';ctx.textAlign='right';
  for(let i=-4;i<=4;i++){const v=ext*i/4,y=yOf(v);ctx.beginPath();ctx.moveTo(labelW,y);ctx.lineTo(cW,y);ctx.stroke();ctx.fillText((v>=0?'+':'')+Math.round(v),labelW-4,y+3);}
  ctx.textAlign='left';
  ctx.fillStyle='rgba(63,185,80,0.08)';ctx.fillRect(labelW,yOf(tol),cW-labelW,yOf(-tol)-yOf(tol));
  ctx.strokeStyle='rgba(63,185,80,0.5)';ctx.setLineDash([4,4]);[tol,-tol].forEach(v=>{ctx.beginPath();ctx.moveTo(labelW,yOf(v));ctx.lineTo(cW,yOf(v));ctx.stroke();});ctx.setLineDash([]);
  ctx.save();ctx.translate(12,topPad+chartH/2);ctx.rotate(-Math.PI/2);ctx.fillStyle='#8b949e';ctx.font='11px Segoe UI';ctx.textAlign='center';ctx.fillText('편차 (µs)',0,0);ctx.restore();ctx.textAlign='left';
  ctx.save();ctx.beginPath();ctx.rect(labelW,0,cW-labelW,cH);ctx.clip();
  // Event Counter grid
  const visMin=ecMin+(tlPanX/chartW)*range,visMax=ecMin+((tlPanX+cW-labelW)/chartW)*range;
  const step=Math.max(1,Math.pow(10,Math.floor(Math.log10(Math.max(1,(visMax-visMin)/8)))));
  ctx.fillStyle='#484f58';
  for(let g=Math.floor(visMin/step)*step;g<=visMax+step;g+=step){const x=xOf(g);if(x<labelW||x>cW)continue;ctx.strokeStyle='#161b22';ctx.beginPath();ctx.moveTo(x,topPad);ctx.lineTo(x,topPad+chartH);ctx.stroke();ctx.fillText(Math.round(g),x-8,cH-botPad+14);}
  const r=Math.max(2,3/Math.sqrt(tlZoom));
  sids.forEach(sid=>{
    const col=getColor(sid,null).fg,P=pts.filter(p=>p.sid===sid);
    ctx.strokeStyle=col;ctx.globalAlpha=0.45;ctx.lineWidth=1;ctx.beginPath();
    P.forEach((p,i)=>{const x=xOf(p.ec),y=yOf(p.dev);if(i&&p.ec-P[i-1].ec<=8)ctx.lineTo(x,y);else ctx.moveTo(x,y);});ctx.stroke();ctx.globalAlpha=1;
    P.forEach(p=>{
      const x=xOf(p.ec),y=yOf(p.dev);if(x<labelW-5||x>cW+5)return;
      ctx.fillStyle=p.flag?'#f85149':col;ctx.beginPath();ctx.arc(x,y,p.flag?4:r,0,Math.PI*2);ctx.fill();
      tlHitBoxes.push({x,y,r:Math.max(4,r),tooltip:`<div class="tt-title" style="color:${col}">${escHtml(streamLabel(sid))} — Event ${p.ec}</div><div class="tt-row"><span class="tt-key">앵커 간격 편차</span><span class="tt-val${p.flag?' tt-error':''}">${p.dev>=0?'+':''}${Math.round(p.dev)} µs</span></div><div class="tt-row"><span class="tt-key">허용 오차</span><span class="tt-val">± ${tol} µs</span></div>`});
    });
    marks.filter(m=>m.sid===sid).forEach(m=>{
      const x=xOf(m.ec),y=yOf(m.dev);if(x<labelW-5||x>cW+5)return;
      ctx.fillStyle=col;ctx.strokeStyle='#f85149';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x+5,y+4);ctx.lineTo(x-5,y+4);ctx.closePath();ctx.fill();ctx.stroke();
      tlHitBoxes.push({x,y,r:6,tooltip:`<div class="tt-title" style="color:${col}">${escHtml(streamLabel(sid))} — Event ${m.ec}</div><div class="tt-error">${escHtml(m.detail||'')}</div>`});
    });
  });
  ctx.restore();
  ctx.fillStyle='#8b949e';ctx.font='10px Segoe UI';ctx.fillText('Event Counter →',labelW+8,cH-4);
  if(tlZoom>1){ctx.fillStyle='#484f58';ctx.fillText(`Zoom: ${tlZoom.toFixed(1)}x`,cW-80,12);}
  if(lg){
    const n=k=>issues.filter(i=>i.type===k&&sids.includes(i.sid)).length;
    lg.innerHTML=sids.map(sid=>`<span><i style="background:${getColor(sid,null).fg};"></i>${escHtml(streamLabel(sid))}</span>`).join('')
      +`<span><i style="background:#f85149;border-radius:50%;"></i>Anchor Timing ${n('anchorTiming')}</span><span>▲ Slot Timing ${n('slotTiming')}</span><span><i style="background:rgba(63,185,80,0.25);border:1px dashed rgba(63,185,80,0.7);"></i>± ${tol} µs</span>`;
  }
}

// ========== PAIRING VIEW ==========
// X = Event Counter, per CIS: shows C→P and P→C side by side
// Missing packets shown as hollow red circles
function drawTimelinePairing() {
  const wrap=document.getElementById('tlCanvasWrap');
  const canvas=document.getElementById('tlCanvas');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const cW=wrap.clientWidth,cH=wrap.clientHeight||400;
  canvas.width=cW*dpr;canvas.height=cH*dpr;canvas.style.width=cW+'px';canvas.style.height=cH+'px';ctx.scale(dpr,dpr);

  tlHitBoxes=[];
  const sc=getStreamCol(),ecCol=detectedFields.eventCounter,dc=getDirCol();
  const vis=getVisibleData();
  if(vis.length===0||dc===undefined){ctx.fillStyle='#8b949e';ctx.font='14px Segoe UI';ctx.fillText(dc===undefined?'Pairing view requires Direction column':'No visible packets',cW/2-100,cH/2);return;}

  // Build per-stream, per-event-counter map: which directions have packets?
  const visStreamIds=[...activeStreams].sort();
  const dirVals=[...new Set(vis.map(r=>r[dc]))].sort();
  if(dirVals.length<2){ctx.fillStyle='#8b949e';ctx.font='14px Segoe UI';ctx.fillText('Need at least 2 directions for pairing',cW/2-100,cH/2);return;}

  // Classify directions by sender (same rule as everywhere else, overridable in Column Mapping)
  const dir_cToP=dirVals.find(d=>isCtoPDir(d))??dirVals[0], dir_pToC=dirVals.find(d=>!isCtoPDir(d))??dirVals[1];

  // Per stream: map event counter -> {cToP: [rows], pToC: [rows]}
  const streamData={};
  visStreamIds.forEach(sid=>{streamData[sid]={};});
  vis.forEach((r,vi)=>{
    const sid=getStreamId(r),ec=parseInt(r[ecCol]),dir=r[dc],oi=vis._oi[vi];
    if(isNaN(ec)||!streamData[sid])return;
    if(!streamData[sid][ec])streamData[sid][ec]={cToP:[],pToC:[],allRows:[]};
    const bucket=streamData[sid][ec];
    if(dir===dir_cToP)bucket.cToP.push({oi,row:r,isErr:errorRows.has(oi)});
    else if(dir===dir_pToC)bucket.pToC.push({oi,row:r,isErr:errorRows.has(oi)});
    bucket.allRows.push({oi,row:r,dir,isErr:errorRows.has(oi)});
  });

  // Layout: one row per stream, 2 sub-rows (C→P and P→C)
  const labelW=120, pad=20, topPad=30, botPad=25;
  const streamCount=visStreamIds.length;
  const rowH=Math.min(80,Math.max(40,(cH-topPad-botPad)/streamCount));
  const subH=rowH/2-4;

  // X range (event counters)
  const allEC=[];
  for(const sid of visStreamIds)for(const ec in streamData[sid])allEC.push(parseInt(ec));
  if(allEC.length===0)return;
  const ecMin=Math.min(...allEC),ecMax=Math.max(...allEC),ecRange=ecMax-ecMin||1;
  const chartW=(cW-labelW-pad*2)*tlZoom;

  // Background
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cW,cH);

  // Clip
  ctx.save();ctx.beginPath();ctx.rect(labelW,0,cW-labelW,cH);ctx.clip();

  // X grid
  const visMin=ecMin+(tlPanX/chartW)*ecRange,visMax=ecMin+((tlPanX+cW-labelW)/chartW)*ecRange;
  const gridStep=Math.max(1,Math.pow(10,Math.floor(Math.log10(Math.max(1,(visMax-visMin)/10)))));
  const gridStart=Math.floor(visMin/gridStep)*gridStep;
  ctx.strokeStyle='#161b22';ctx.fillStyle='#484f58';ctx.font='10px Segoe UI';
  for(let g=gridStart;g<=visMax+gridStep;g+=gridStep){
    const px=labelW+pad+((g-ecMin)/ecRange)*chartW-tlPanX;
    if(px<labelW||px>cW)continue;
    ctx.beginPath();ctx.moveTo(px,topPad);ctx.lineTo(px,cH-botPad);ctx.stroke();
    ctx.fillText(Math.round(g),px-8,cH-8);
  }

  // Track missing packet stats
  let totalMissingCtoP=0, totalMissingPtoC=0;

  // Draw per stream
  visStreamIds.forEach((sid,si)=>{
    const yBase=topPad+si*rowH;
    const yCtoP=yBase+subH/2+2;
    const yPtoC=yBase+subH+subH/2+6;
    const baseCol=streamColorCache[sid];
    const colCtoP=getColor(sid,dir_cToP);
    const colPtoC=getColor(sid,dir_pToC);

    // Row background
    ctx.fillStyle=baseCol?baseCol.baseBg:'rgba(255,255,255,0.02)';
    ctx.fillRect(labelW,yBase,cW-labelW,rowH);
    // Separator
    ctx.strokeStyle='#1c2028';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(labelW,yBase+rowH);ctx.lineTo(cW,yBase+rowH);ctx.stroke();
    // Sub-row divider (dashed)
    ctx.strokeStyle='#161b22';ctx.setLineDash([2,3]);
    ctx.beginPath();ctx.moveTo(labelW,yBase+rowH/2);ctx.lineTo(cW,yBase+rowH/2);ctx.stroke();
    ctx.setLineDash([]);

    // Draw events
    const events=streamData[sid];
    for(const ecStr in events){
      const ec=parseInt(ecStr);
      const px=labelW+pad+((ec-ecMin)/ecRange)*chartW-tlPanX;
      if(px<labelW-5||px>cW+5)continue;
      const ev=events[ecStr];
      const hasCtoP=ev.cToP.length>0, hasPtoC=ev.pToC.length>0;
      const ctoPErr=ev.cToP.some(p=>p.isErr), ptoCErr=ev.pToC.some(p=>p.isErr);

      // C→P dot (top sub-row)
      if(hasCtoP){
        ctx.fillStyle=ctoPErr?'#f85149':colCtoP.fg;
        ctx.beginPath();ctx.arc(px,yCtoP,Math.max(2,3/Math.sqrt(tlZoom)),0,Math.PI*2);ctx.fill();
        if(ctoPErr){ctx.strokeStyle='#da3633';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,yCtoP,4,0,Math.PI*2);ctx.stroke();}
      } else {
        // MISSING C→P: hollow red circle
        totalMissingCtoP++;
        ctx.strokeStyle='#f85149';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(px,yCtoP,4,0,Math.PI*2);ctx.stroke();
        // X mark inside
        ctx.beginPath();ctx.moveTo(px-2,yCtoP-2);ctx.lineTo(px+2,yCtoP+2);ctx.moveTo(px+2,yCtoP-2);ctx.lineTo(px-2,yCtoP+2);ctx.stroke();
      }

      // P→C dot (bottom sub-row)
      if(hasPtoC){
        ctx.fillStyle=ptoCErr?'#f85149':colPtoC.fg;
        ctx.beginPath();ctx.arc(px,yPtoC,Math.max(2,3/Math.sqrt(tlZoom)),0,Math.PI*2);ctx.fill();
        if(ptoCErr){ctx.strokeStyle='#da3633';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,yPtoC,4,0,Math.PI*2);ctx.stroke();}
      } else {
        // MISSING P→C: hollow red circle
        totalMissingPtoC++;
        ctx.strokeStyle='#f85149';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(px,yPtoC,4,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(px-2,yPtoC-2);ctx.lineTo(px+2,yPtoC+2);ctx.moveTo(px+2,yPtoC-2);ctx.lineTo(px-2,yPtoC+2);ctx.stroke();
      }

      // Vertical connector if both exist (pairing line)
      if(hasCtoP&&hasPtoC){
        ctx.strokeStyle=baseCol?baseCol.base:'#30363d';ctx.lineWidth=0.5;ctx.globalAlpha=0.3;
        ctx.beginPath();ctx.moveTo(px,yCtoP+3);ctx.lineTo(px,yPtoC-3);ctx.stroke();
        ctx.globalAlpha=1;
      }

      // Hit boxes for both positions
      const makeTooltip=(dirLabel,dirPkts,otherExists,otherDir)=>{
        let tt=`<div class="tt-title" style="color:${getColor(sid,dirLabel).fg}">${escHtml(sid)} — Event ${ec}</div>`;
        tt+=`<div class="tt-row"><span class="tt-key">Direction</span><span class="tt-val">${escHtml(dirLabel)}</span></div>`;
        if(dirPkts.length>0){
          const r2=dirPkts[0].row;
          headers.forEach((h2,ci)=>{if(ci!==sc&&ci!==ecCol&&ci!==dc)tt+=`<div class="tt-row"><span class="tt-key">${escHtml(h2)}</span><span class="tt-val">${escHtml(r2[ci]||'')}</span></div>`;});
          if(dirPkts[0].isErr)tt+=`<div class="tt-error" style="margin-top:4px;">CRC/Status Error</div>`;
        } else {
          tt+=`<div class="tt-error" style="margin-top:4px;font-weight:600;">MISSING — ${escHtml(otherDir)} exists but ${escHtml(dirLabel)} is absent</div>`;
        }
        if(!otherExists)tt+=`<div style="color:#d29922;margin-top:2px;">${escHtml(otherDir)} also missing for this event</div>`;
        tt+=``;
        return tt;
      };

      tlHitBoxes.push({x:px,y:yCtoP,r:5,origIdx:hasCtoP?ev.cToP[0].oi:(hasPtoC?ev.pToC[0].oi:-1),sid,dir:dir_cToP,ec,isErr:ctoPErr,isMissing:!hasCtoP,hasGap:false,gap:null,row:hasCtoP?ev.cToP[0].row:(hasPtoC?ev.pToC[0].row:null),
        tooltip:makeTooltip(dir_cToP,ev.cToP,hasPtoC,dir_pToC)});
      tlHitBoxes.push({x:px,y:yPtoC,r:5,origIdx:hasPtoC?ev.pToC[0].oi:(hasCtoP?ev.cToP[0].oi:-1),sid,dir:dir_pToC,ec,isErr:ptoCErr,isMissing:!hasPtoC,hasGap:false,gap:null,row:hasPtoC?ev.pToC[0].row:(hasCtoP?ev.cToP[0].row:null),
        tooltip:makeTooltip(dir_pToC,ev.pToC,hasCtoP,dir_cToP)});
    }
  });

  ctx.restore(); // unclip

  // Labels
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,labelW,cH);
  visStreamIds.forEach((sid,si)=>{
    const yBase=topPad+si*rowH;
    const yCtoP=yBase+subH/2+2;
    const yPtoC=yBase+subH+subH/2+6;
    const baseCol=streamColorCache[sid];
    const colCtoP=getColor(sid,dir_cToP);
    const colPtoC=getColor(sid,dir_pToC);

    // Stream group bg
    ctx.fillStyle=baseCol?baseCol.baseBg:'transparent';
    ctx.fillRect(0,yBase,labelW,rowH);
    ctx.strokeStyle=baseCol?baseCol.base:'#30363d';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(labelW-2,yBase);ctx.lineTo(labelW-2,yBase+rowH);ctx.stroke();

    // Stream ID
    ctx.fillStyle=baseCol?baseCol.base:'#c9d1d9';ctx.font='bold 11px Segoe UI';ctx.textAlign='right';
    ctx.fillText(sid,labelW-8,yBase+12);

    // Direction labels
    ctx.font='10px Segoe UI';
    ctx.fillStyle=colCtoP.fg;ctx.fillText('C→P',labelW-8,yCtoP+3);
    ctx.fillStyle=colPtoC.fg;ctx.fillText('P→C',labelW-8,yPtoC+3);
  });
  ctx.textAlign='left';

  // Bottom
  ctx.fillStyle='#8b949e';ctx.font='10px Segoe UI';ctx.fillText('Event Counter →',cW/2-40,cH-4);

  // Zoom
  if(tlZoom>1){ctx.fillStyle='#484f58';ctx.font='10px Segoe UI';ctx.fillText(`Zoom: ${tlZoom.toFixed(1)}x`,cW-80,topPad-10);}

  // Legend + missing stats
  const lgX=labelW+pad+10,lgY=topPad-14;
  ctx.fillStyle='#3fb950';ctx.beginPath();ctx.arc(lgX,lgY,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#484f58';ctx.font='10px Segoe UI';ctx.fillText('Paired',lgX+7,lgY+3);
  // Missing marker
  ctx.strokeStyle='#f85149';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(lgX+55,lgY,4,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(lgX+53,lgY-2);ctx.lineTo(lgX+57,lgY+2);ctx.moveTo(lgX+57,lgY-2);ctx.lineTo(lgX+53,lgY+2);ctx.stroke();
  ctx.fillStyle='#484f58';ctx.fillText('Missing',lgX+63,lgY+3);

  if(totalMissingCtoP>0||totalMissingPtoC>0){
    ctx.fillStyle='#f85149';ctx.font='bold 10px Segoe UI';
    ctx.fillText(`Missing C→P: ${totalMissingCtoP}  |  Missing P→C: ${totalMissingPtoC}`,lgX+120,lgY+3);
  }
}

// ============================================================
//  ISO EVENT GRID (Timeline mode)
//  X = Event Counter, rows = stream × subevent × direction. Each cell is one
//  packet colored by its Issues-tab outcome; empty cells show a missing
//  response or a skipped subevent; events missing entirely are shaded.
// ============================================================
const GRID_KINDS = {
  nul:       {label:'Null PDU',        color:'#30363d'},
  ok:        {label:'OK',              color:'#238636'},
  retx:      {label:'재전송',           color:'#d29922'},
  carry:     {label:'FT 이월 재전송',    color:'#39c5bb'},
  timing:    {label:'Timing β',         color:'rgba(232,90,173,0.35)', stroke:'#e85aad'},
  payload:   {label:'Payload 이상',     color:'#58a6ff'},
  nack:      {label:'NACK (CRC OK)',   color:'#a371f7'},
  recovered: {label:'CRC → Recovered', color:'#db6d28'},
  skip:      {label:'SE Skip',         color:'rgba(219,109,40,0.25)', stroke:'#db6d28'},
  noresp:    {label:'No Response',     color:'rgba(248,81,73,0.3)', stroke:'#f85149'},
  lost:      {label:'CRC → Lost',      color:'#f85149'},
};
const GRID_PRI = Object.keys(GRID_KINDS); // draw order: later kinds stay on top when cells overlap
let gridModel=null, gridLayout=null;

function buildGridModel(){
  const f=detectedFields,sc=getStreamCol(),ecCol=f.eventCounter,seCol=f.subevent,dc=getDirCol();
  const dirs=dc!==undefined?[...new Set(rawData.map(r=>r[dc]))].sort((a,b)=>isCtoPDir(b)-isCtoPDir(a)):[''];
  const issueByRow=new Map();issues.forEach(it=>{if(!issueByRow.has(it.oi))issueByRow.set(it.oi,[]);issueByRow.get(it.oi).push(it);});
  const isNull=r=>(f.npi!==undefined&&r[f.npi].trim()==='1')||(f.payloadLen!==undefined&&parseInt(r[f.payloadLen])===0);
  const streams=new Map(),ord=new Map();
  let ecMin=Infinity,ecMax=-Infinity,seMin=Infinity,seMax=-Infinity;
  rawData.forEach((r,oi)=>{
    const sid=getStreamId(r);if(sc!==null&&!activeStreams.has(sid))return;
    const ec=parseInt(r[ecCol]);if(isNaN(ec))return;
    const d=dc!==undefined?r[dc]:'',di=dirs.indexOf(d);
    let se;
    if(seCol!==undefined)se=parseInt(r[seCol]);
    else{const k=sid+'|'+ec+'|'+d;se=(ord.get(k)||0)+1;ord.set(k,se);} // no Subevent column: n-th packet of that direction in the event
    if(isNaN(se))return;
    if(!streams.has(sid))streams.set(sid,new Map());
    const evs=streams.get(sid);if(!evs.has(ec))evs.set(ec,new Map());
    const ses=evs.get(ec);if(!ses.has(se))ses.set(se,[]);
    ses.get(se)[di]={oi,row:r,nul:isNull(r),issues:issueByRow.get(oi)||[]};
    ecMin=Math.min(ecMin,ec);ecMax=Math.max(ecMax,ec);seMin=Math.min(seMin,se);seMax=Math.max(seMax,se);
  });
  const cells=[],gaps=[],counts={};
  streams.forEach((evs,sid)=>{
    const ecs=[...evs.keys()].sort((a,b)=>a-b);
    ecs.forEach((ec,i)=>{
      const ses=evs.get(ec);
      if(i>0&&ec-ecs[i-1]>1)gaps.push({sid,from:ecs[i-1]+1,to:ec-1});
      const maxSe=Math.max(...ses.keys());
      for(let se=seMin;se<=maxSe;se++){
        const pk=ses.get(se)||[];
        dirs.forEach((d,di)=>{
          const p=pk[di];let kind=null;
          if(p){
            const t=new Set(p.issues.map(it=>it.type));
            // Retransmission = a later copy of the same payload (payload model): 'carry' when it is in a later event (FT>1)
            const pi=pktInfo.get(p.oi)||{};
            kind=t.has('crcLost')?'lost':t.has('crcRecovered')?'recovered':t.has('nack')?'nack'
              :(t.has('payloadEmpty')||t.has('payloadLen')||t.has('payloadZero'))?'payload'
              :(t.has('anchorTiming')||t.has('slotTiming'))?'timing':p.nul?'nul':pi.carry?'carry':pi.retx>0?'retx':'ok';
          }else if(d&&!isCtoPDir(d)&&pk.some((q,qi)=>q&&isCtoPDir(dirs[qi]))){
            kind='noresp';
          }else if(!pk.some(q=>q)){
            kind='skip';
          }
          // A skipped subevent spans every direction row; count it once, like the Issues tab
          if(kind){cells.push({sid,ec,se,di,kind,p});if(kind!=='skip'||di===0)counts[kind]=(counts[kind]||0)+1;}
        });
      }
    });
  });
  cells.sort((a,b)=>GRID_PRI.indexOf(a.kind)-GRID_PRI.indexOf(b.kind));
  const cellMap=new Map();cells.forEach(c=>cellMap.set(`${c.sid}|${c.ec}|${c.se}|${c.di}`,c));
  return{src:issues,streamsKey:[...activeStreams].sort().join(','),sids:streamIds.filter(s=>streams.has(s)),dirs,ecMin,ecMax,seMin,seMax,cells,gaps,cellMap,counts};
}

function drawTimelineGrid(){
  const wrap=document.getElementById('tlCanvasWrap'),canvas=document.getElementById('tlCanvas'),ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1,cW=wrap.clientWidth,cH=wrap.clientHeight||400;
  canvas.width=cW*dpr;canvas.height=cH*dpr;canvas.style.width=cW+'px';canvas.style.height=cH+'px';ctx.scale(dpr,dpr);
  tlHitBoxes=[];gridLayout=null;
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cW,cH);
  if(!gridModel||gridModel.src!==issues||gridModel.streamsKey!==[...activeStreams].sort().join(','))gridModel=buildGridModel();
  const M=gridModel;

  let lg=GRID_PRI.map(k=>{const g=GRID_KINDS[k];return`<span><i style="background:${g.color};border:1px solid ${g.stroke||g.color};"></i>${g.label} ${M.counts[k]||0}</span>`;}).join('');
  lg+=`<span><i style="background:rgba(210,153,34,0.3);border:1px solid #d29922;"></i>EC Skip ${M.gaps.length}</span>`;
  document.getElementById('tlLegend').innerHTML=lg;
  if(M.sids.length===0){ctx.fillStyle='#8b949e';ctx.font='14px Segoe UI';ctx.fillText('No visible packets',cW/2-60,cH/2);return;}

  const labelW=120,pad=20,topPad=12,botPad=25,blockGap=10;
  const nSe=M.seMax-M.seMin+1,nDir=M.dirs.length;
  const rowH=Math.max(4,Math.min(26,(cH-topPad-botPad-blockGap*(M.sids.length-1))/(M.sids.length*nSe*nDir)));
  const blockH=nSe*nDir*rowH;
  const ecSpan=M.ecMax-M.ecMin+1,chartW=(cW-labelW-pad*2)*tlZoom,colW=chartW/ecSpan;
  const xOf=ec=>labelW+pad+(ec-M.ecMin)*colW-tlPanX;
  const blocks=M.sids.map((sid,i)=>({sid,y0:topPad+i*(blockH+blockGap)})),blockIdx=Object.fromEntries(M.sids.map((s,i)=>[s,i]));
  const rowY=(bi,se,di)=>blocks[bi].y0+((se-M.seMin)*nDir+di)*rowH;
  gridLayout={labelW,pad,colW,blocks,blockH,rowH,nDir};

  ctx.save();ctx.beginPath();ctx.rect(labelW,0,cW-labelW,cH);ctx.clip();
  // Block backgrounds, subevent separators
  blocks.forEach(b=>{
    ctx.fillStyle='#161b22';ctx.fillRect(labelW,b.y0,cW-labelW,blockH);
    ctx.strokeStyle='#21262d';ctx.lineWidth=1;
    for(let s=1;s<nSe;s++){const y=b.y0+s*nDir*rowH;ctx.beginPath();ctx.moveTo(labelW,y);ctx.lineTo(cW,y);ctx.stroke();}
  });
  // Event Counter grid
  const visMin=M.ecMin+tlPanX/colW,visMax=visMin+(cW-labelW)/colW;
  const gridStep=Math.max(1,Math.pow(10,Math.floor(Math.log10(Math.max(1,(visMax-visMin)/10)))));
  ctx.strokeStyle='#21262d';ctx.fillStyle='#484f58';ctx.font='10px Segoe UI';
  for(let g=Math.floor(visMin/gridStep)*gridStep;g<=visMax+gridStep;g+=gridStep){
    const px=xOf(g);if(px<labelW||px>cW)continue;
    ctx.beginPath();ctx.moveTo(px,topPad);ctx.lineTo(px,cH-botPad);ctx.stroke();ctx.fillText(Math.round(g),px-8,cH-botPad+12);
  }
  // Events missing entirely (both directions)
  M.gaps.forEach(g=>{
    const x1=xOf(g.from),x2=xOf(g.to+1);if(x2<labelW||x1>cW)return;const b=blocks[blockIdx[g.sid]];
    ctx.fillStyle='rgba(210,153,34,0.3)';ctx.fillRect(x1,b.y0,Math.max(2,x2-x1),blockH);
    ctx.strokeStyle='#d29922';ctx.strokeRect(x1+0.5,b.y0+0.5,Math.max(1,x2-x1-1),blockH-1);
  });
  // Packet cells
  const cw=Math.max(1,colW-(colW>=4?1:0)),ch=Math.max(1,rowH-1);
  M.cells.forEach(c=>{
    const x=xOf(c.ec);if(x+cw<labelW||x>cW)return;
    const k=GRID_KINDS[c.kind],y=rowY(blockIdx[c.sid],c.se,c.di),big=cw>=5&&ch>=5;
    // Outlined kinds are translucent; when cells are too narrow for the outline, fill with the solid stroke color instead
    ctx.fillStyle=k.stroke&&!big?k.stroke:k.color;ctx.fillRect(x,y,cw,ch);
    if(k.stroke&&big){
      ctx.strokeStyle=k.stroke;ctx.lineWidth=1;if(c.kind==='skip')ctx.setLineDash([2,2]);
      ctx.strokeRect(x+0.5,y+0.5,cw-1,ch-1);ctx.setLineDash([]);
      if(c.kind==='noresp'){ctx.beginPath();ctx.moveTo(x+2,y+2);ctx.lineTo(x+cw-2,y+ch-2);ctx.moveTo(x+cw-2,y+2);ctx.lineTo(x+2,y+ch-2);ctx.stroke();}
    }
  });
  ctx.restore();

  // Labels
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,labelW,cH);
  blocks.forEach((b,bi)=>{
    const base=getColor(b.sid,null).fg;
    ctx.strokeStyle=base;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(labelW-2,b.y0);ctx.lineTo(labelW-2,b.y0+blockH);ctx.stroke();
    ctx.fillStyle=base;ctx.font='bold 11px Segoe UI';ctx.textAlign='left';ctx.fillText(streamLabel(b.sid),4,b.y0+Math.min(blockH/2+4,11));
    if(rowH>=9){
      ctx.font=`${Math.min(10,rowH-1)}px Segoe UI`;ctx.textAlign='right';
      for(let se=M.seMin;se<=M.seMax;se++)M.dirs.forEach((d,di)=>{ctx.fillStyle=getColor(b.sid,d||null).fg;ctx.fillText(`SE${se}${d?' '+dirShort(d):''}`,labelW-8,rowY(bi,se,di)+rowH/2+3);});
    }
  });
  ctx.textAlign='left';
  ctx.fillStyle='#8b949e';ctx.font='10px Segoe UI';ctx.fillText('Event Counter →',8,cH-botPad+12);
  if(tlZoom>1){ctx.fillStyle='#484f58';ctx.fillText(`Zoom: ${tlZoom.toFixed(1)}x`,8,cH-botPad+24);}
}

function gridHit(mx,my){
  const L=gridLayout,M=gridModel;if(!L||!M||mx<L.labelW)return null;
  const ec=M.ecMin+Math.floor((mx-L.labelW-L.pad+tlPanX)/L.colW);
  const bi=L.blocks.findIndex(b=>my>=b.y0&&my<b.y0+L.blockH);if(bi<0)return null;
  const sid=L.blocks[bi].sid,ri=Math.floor((my-L.blocks[bi].y0)/L.rowH),se=M.seMin+Math.floor(ri/L.nDir),di=ri%L.nDir;
  const c=M.cellMap.get(`${sid}|${ec}|${se}|${di}`);
  if(c)return{tooltip:gridTooltip(c)};
  const g=M.gaps.find(g=>g.sid===sid&&ec>=g.from&&ec<=g.to);
  if(g)return{tooltip:`<div class="tt-title" style="color:#d29922">${escHtml(streamLabel(sid))} — Event ${g.from}${g.to>g.from?'–'+g.to:''}</div><div style="color:#d29922;">EC Skip: 이 이벤트의 패킷이 양방향 모두 없음</div>`};
  return null;
}

function gridTooltip(c){
  const f=detectedFields,d=gridModel.dirs[c.di],k=GRID_KINDS[c.kind];
  const typeLabel=Object.fromEntries(ISSUE_TYPES.map(t=>[t.key,t.label]));
  const row=(key,val)=>`<div class="tt-row"><span class="tt-key">${escHtml(key)}</span><span class="tt-val">${escHtml(val)}</span></div>`;
  let tt=`<div class="tt-title" style="color:${getColor(c.sid,d||null).fg}">${escHtml(streamLabel(c.sid))} — Event ${c.ec} · SE${c.se}${d?' · '+dirShort(d):''}</div>`;
  tt+=`<div class="tt-row"><span class="tt-key">상태</span><span class="tt-val" style="color:${k.stroke||k.color};font-weight:600;">${k.label}</span></div>`;
  if(c.p){
    [['sn','SN'],['nesn','NESN'],['npi','NPI'],['crc','CRC'],['status','Status'],['payloadLen','Length'],['channel','Channel'],['rssi','RSSI'],['timestamp','Time']]
      .forEach(([key,lb])=>{if(f[key]!==undefined)tt+=row(lb,c.p.row[f[key]]||'');});
    c.p.issues.forEach(it=>{tt+=`<div class="tt-error" style="margin-top:2px;">${escHtml(typeLabel[it.type])}: ${escHtml(it.detail)}</div>`;});
  }
  else if(c.kind==='noresp')tt+=`<div class="tt-error">C→P는 송신됐지만 P→C 응답이 캡처되지 않음</div>`;
  else if(c.kind==='skip')tt+=`<div style="color:#db6d28;">이 Subevent는 양방향 모두 패킷 없음 (이후 Subevent는 있음)</div>`;
  tt+=``;
  return tt;
}

function setupTimelineEvents(){
  const canvas=document.getElementById('tlCanvas');
  const sel=document.getElementById('tlSelection');

  canvas.addEventListener('wheel',e=>{
    e.preventDefault();const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left;
    const old=tlZoom;tlZoom*=e.deltaY<0?1.15:1/1.15;tlZoom=Math.max(1,Math.min(100,tlZoom));
    const ca=mx-120-20;if(ca>0)tlPanX=(tlPanX+ca)*(tlZoom/old)-ca;
    tlPanX=Math.max(0,tlPanX);drawTimeline();
  },{passive:false});

  canvas.addEventListener('mousedown',e=>{
    const rect=canvas.getBoundingClientRect();
    if(e.shiftKey){tlSelecting=true;tlSelStartX=e.clientX-rect.left;tlSelEndX=tlSelStartX;sel.style.left=tlSelStartX+'px';sel.style.width='0px';sel.classList.add('active');}
    else{tlDragging=true;tlDragStartX=e.clientX;tlDragStartPan=tlPanX;canvas.style.cursor='grabbing';}
  });

  document.addEventListener('mousemove',e=>{
    if(tlDragging){tlPanX=tlDragStartPan-(e.clientX-tlDragStartX);tlPanX=Math.max(0,tlPanX);drawTimeline();}
    if(tlSelecting){const rect=canvas.getBoundingClientRect();tlSelEndX=e.clientX-rect.left;const x1=Math.min(tlSelStartX,tlSelEndX),x2=Math.max(tlSelStartX,tlSelEndX);sel.style.left=x1+'px';sel.style.width=(x2-x1)+'px';}
  });

  document.addEventListener('mouseup',()=>{
    if(tlDragging){tlDragging=false;document.getElementById('tlCanvas').style.cursor='';}
    if(tlSelecting){tlSelecting=false;if(Math.abs(tlSelEndX-tlSelStartX)>5){tlSelActive=true;document.getElementById('btnTlSelApply').style.display='';}else{sel.classList.remove('active');tlSelActive=false;document.getElementById('btnTlSelApply').style.display='none';}}
  });

  canvas.addEventListener('mousemove',e=>{
    if(tlDragging||tlSelecting)return;
    const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
    if(tlMode==='grid'){const h=gridHit(mx,my);if(h){showTooltip(e.clientX,e.clientY,h.tooltip);canvas.style.cursor=e.shiftKey?'crosshair':'grab';}else{hideTooltip();canvas.style.cursor=e.shiftKey?'crosshair':'grab';}return;}
    for(const hb of tlHitBoxes){
      if(Math.hypot(mx-hb.x,my-hb.y)<hb.r+2){
        if(hb.tooltip){
          // Pre-built tooltip (pairing mode)
          showTooltip(e.clientX,e.clientY,hb.tooltip);
        } else {
          // Build tooltip (RSSI/Channel mode)
          const col=getColor(hb.sid,hb.dir);
          let tt=`<div class="tt-title" style="color:${col.fg}">${escHtml(hb.sid)} ${escHtml(hb.dir||'')} — Event ${hb.ec}</div>`;
          if(hb.yVal!==undefined) tt+=`<div class="tt-row"><span class="tt-key">${tlMode==='rssi'?'RSSI':'Channel'}</span><span class="tt-val">${hb.yVal}${tlMode==='rssi'?' dBm':''}</span></div>`;
          headers.forEach((h,ci)=>{if(ci!==getStreamCol()&&ci!==detectedFields.eventCounter&&ci!==getDirCol()&&ci!==(tlMode==='rssi'?detectedFields.rssi:detectedFields.channel))tt+=`<div class="tt-row"><span class="tt-key">${escHtml(h)}</span><span class="tt-val">${escHtml(hb.row[ci]||'')}</span></div>`;});
          if(hb.isErr)tt+=`<div class="tt-error" style="margin-top:4px;">CRC/Status Error</div>`;
          showTooltip(e.clientX,e.clientY,tt);
        }
        canvas.style.cursor=e.shiftKey?'crosshair':'grab';return;
      }
    }
    hideTooltip();canvas.style.cursor=e.shiftKey?'crosshair':'grab';
  });


}

// Seeded PRNG so the sample (and its injected anomalies) is identical on every load
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// Realistic CIS capture: 1 CIG, 2 CIS (L/R), ISO interval 10ms, NSE=3, BN=1, FT=1, LE 2M.
// Each subevent is C→P then P→C. SN/NESN follow ack/retransmit rules; a side whose SDU is
// already acked sends a null PDU (NPI=1, length 0). The event closes once both SDUs are acked.
// Injected anomalies (to verify detectors):
//   - background CRC failures ~3%, 25% on channel 22 (interference), +15% on CIS 0x02 events 100-149 (weak RSSI)
//   - Peripheral not responding: random 0.5% per subevent, forced at 0x01:57 SE1 and the whole of 0x02:233
//   - Event Counter skip: CIS 0x02 events 200-202 absent in both directions
//   - Subevent skip (SE2 not captured): 0x01:80, 0x02:260
//   - Payload: all-zero C→P at 0x01:120, wrong C→P length at 0x02:310, P→C null instead of audio at 0x01:150 and 0x01:151
function generateSampleData(){
  const rnd=mulberry32(20261022);
  const ISO_INT=10,SUB_INT=1.5,NSE=3,CIS_OFFSET=NSE*SUB_INT,RESP_DELAY=0.7,T0=12;
  const C2P='Central→Peripheral',P2C='Peripheral→Central',LEN_C2P=120,LEN_P2C=40;
  const cisIds=['0x01','0x02'];
  const inject={
    '0x01:57':{noResp:[1]}, '0x02:233':{noResp:[1,2,3]},
    '0x01:80':{crcC:[1,2],drop:[2]}, '0x02:260':{crcP:[1,2],drop:[2]},
    '0x01:120':{zeroPayload:true}, '0x02:310':{badLen:60},
    '0x01:150':{nullP:true}, '0x01:151':{nullP:true},
  };
  const hex=n=>Array.from({length:n},()=>Math.floor(rnd()*256).toString(16).padStart(2,'0').toUpperCase()).join(' ');
  const rows=[],sn={};cisIds.forEach(c=>sn[c]={c:1,p:1});
  const push=(t,dir,cis,ev,se,s,ne,npi,ch,rssi,crcFail,len,payload)=>rows.push([String(rows.length+1),(t+(rnd()-0.5)*0.004).toFixed(3)+' ms',dir,'0x00',cis,String(ev),String(se),String(s),String(ne),String(npi),'LE 2M',String(ch),String(rssi),crcFail?'Fail':'OK',String(len),payload]);
  for(let ev=0;ev<400;ev++){
    cisIds.forEach((cis,ci)=>{
      const st=sn[cis];st.c^=1;st.p^=1; // new SDU each event (FT=1)
      if(cis==='0x02'&&ev>=200&&ev<=202)return;
      const inj=inject[cis+':'+ev]||{},weak=cis==='0x02'&&ev>=100&&ev<150;
      let cAck=false,pAck=false;
      for(let se=1;se<=NSE&&!(cAck&&pAck);se++){
        const tC=T0+ev*ISO_INT+ci*CIS_OFFSET+(se-1)*SUB_INT;
        const ch=Math.floor(rnd()*37),pErr=(ch===22?0.25:0.03)+(weak?0.15:0);
        const rssi=-48-Math.floor(rnd()*12)-(weak?20:0),captured=!(inj.drop||[]).includes(se);
        // C→P: null PDU once its SDU has been acked
        const cNull=cAck,cCrcFail=(inj.crcC||[]).includes(se)||rnd()<pErr;
        const cLen=cNull?0:(inj.badLen||LEN_C2P);
        const cPayload=cNull?'':inj.zeroPayload?Array(cLen).fill('00').join(' '):hex(cLen);
        if(captured)push(tC,C2P,cis,ev,se,st.c,pAck?st.p^1:st.p,cNull?1:0,ch,rssi,cCrcFail,cLen,cPayload);
        const pNoResp=(inj.noResp||[]).includes(se)||rnd()<0.005;
        if(pNoResp)continue; // Peripheral missed the C→P packet entirely: no response, no ack
        if(!cCrcFail)cAck=true;
        // P→C: NESN acks C's SN once received
        const pNull=pAck||inj.nullP,pCrcFail=(inj.crcP||[]).includes(se)||rnd()<pErr;
        const pLen=pNull?0:LEN_P2C;
        if(captured)push(tC+RESP_DELAY,P2C,cis,ev,se,st.p,cAck?st.c^1:st.c,pNull?1:0,ch,rssi-3,pCrcFail,pLen,pNull?'':hex(pLen));
        if(!pCrcFail)pAck=true;
      }
    });
  }
  return{headers:['Item','Timestamp','Direction','CIG ID','CIS ID','Event Counter','Subevent','SN','NESN','NPI','PHY','Channel','RSSI','CRC','Payload Length','Payload'],data:rows};
}

// Sample 2 (FT / BN / timing): 1 CIG, 2 CIS, ISO interval 10 ms, NSE 4, Sub_Interval 1.1 ms, LE 2M.
// C→P BN=2 FT=2 (two 5 ms frames per event, 60 B), P→C BN=1 FT=2 (40 B).
// Both link layers are simulated: a payload is retried until acked or until its flush point
// (event gen+FT-1, after subevent NSE − floor(NSE/BN)·(BN−i) for payload i = 1..BN),
// SN/NESN advance on ack or flush at both ends, a corrupted C→P is still answered (with NESN
// unchanged), and the Central ends the event once its payloads are acked and every pending
// Peripheral payload has been received. Reply = C→P end + T_IFS 150 µs; timestamp jitter ±2 µs.
// Injected: 0x01:60 all C→P fail and 0x01:61 SE1 fails (C payloads carried to 61), 0x02:90 Peripheral
// misses the event, 0x02:140-141 all C→P fail (payloads of 140 lost after FT), 0x01:170 all P→C fail.
// Timing: 0x02:120 anchor +80 µs (that event only), 0x01 anchor step +60 µs from event 300,
// 0x01:200 SE2 C→P +50 µs, 0x02:250 SE1 P→C reply +40 µs.
// Capture loss: 0x01 events 350-351, 0x02:330 SE2.
// Returns ground truth too (payload outcomes, injected timing), used by tests.
function generateSampleData2(o){
  const opt=Object.assign({seed:20261022,events:400,bnC:2,ftC:2,bnP:1,ftP:2,nse:4,iso:10,sub:1.1,crc:0.04,mismatch:0,noResp:0.004,timing:true,drops:true,inject:true},o||{});
  const rnd=mulberry32(opt.seed);
  const C2P='Central→Peripheral',P2C='Peripheral→Central',LEN_C=60,LEN_P=40,T0=5;
  const cisIds=['0x01','0x02'];
  const inj=opt.inject?{'0x01:60':{cAll:1},'0x01:61':{cSe:[1]},'0x02:90':{noRespAll:1},'0x02:140':{cAll:1},'0x02:141':{cAll:1},'0x01:170':{pAll:1}}:{};
  const tim=opt.timing?{'0x02:120':{anchor:80},'0x01:200':{slot:[2,50]},'0x02:250':{resp:[1,40]}}:{};
  const stepAt=opt.timing?{sid:'0x01',ev:300,us:60}:null;
  const dropped=(cis,ev,se)=>opt.drops&&((cis==='0x01'&&(ev===350||ev===351))||(cis==='0x02'&&ev===330&&se===2));
  const air=len=>((len>0?len+15:11)*4)/1000; // ms on LE 2M (preamble, AA, header, MIC, CRC)
  const hex=n=>Array.from({length:n},()=>Math.floor(rnd()*256).toString(16).padStart(2,'0').toUpperCase()).join(' ');
  const rows=[],truth={payloads:[],timing:[]};
  const st={};cisIds.forEach(c=>st[c]={C:{tx:0,rx:0},P:{tx:0,rx:0},payC:[],payP:[]});
  const mk=(cis,dir,ev,k,bn,ft)=>{const p={sid:cis,dir,gen:ev,k,flushEv:ev+ft-1,flushSe:bn>1?opt.nse-Math.floor(opt.nse/bn)*(bn-1-k):opt.nse /* written out separately from flushSubevent() so tests catch a change to either */,delivered:false,okEv:null,txs:0,firstRow:null};truth.payloads.push(p);return p;};
  const passed=(p,ev,se)=>ev>p.flushEv||(ev===p.flushEv&&se>p.flushSe);
  const push=(t,dir,cis,ev,se,s,ne,npi,ch,rssi,fail,len,payload)=>{if(dropped(cis,ev,se))return -1;rows.push([String(rows.length+1),(t+(rnd()-0.5)*0.004).toFixed(3)+' ms',dir,'0x00',cis,String(ev),String(se),String(s),String(ne),String(npi),'LE 2M',String(ch),String(rssi),fail?'Fail':'OK',String(len),payload]);return rows.length-1;};
  for(let ev=0;ev<opt.events;ev++){
    cisIds.forEach((cis,ci)=>{
      const S=st[cis],C=S.C,P=S.P,ij=inj[cis+':'+ev]||{},tm=tim[cis+':'+ev]||{};
      for(let k=0;k<opt.bnC;k++)S.payC.push(mk(cis,'C→P',ev,k,opt.bnC,opt.ftC));
      for(let k=0;k<opt.bnP;k++)S.payP.push(mk(cis,'P→C',ev,k,opt.bnP,opt.ftP));
      let anchor=T0+ev*opt.iso+ci*opt.nse*opt.sub;
      if(tm.anchor){anchor+=tm.anchor/1000;truth.timing.push({sid:cis,ec:ev,kind:'anchorTiming'},{sid:cis,ec:ev+1,kind:'anchorTiming'});}
      if(stepAt&&cis===stepAt.sid&&ev>=stepAt.ev){anchor+=stepAt.us/1000;if(ev===stepAt.ev)truth.timing.push({sid:cis,ec:ev,kind:'anchorTiming'});}
      for(let se=1;se<=opt.nse;se++){
        // Flush points: sender and receiver both move past payloads whose flush point has passed
        while(C.tx<S.payC.length&&passed(S.payC[C.tx],ev,se))C.tx++;
        while(P.rx<S.payC.length&&passed(S.payC[P.rx],ev,se))P.rx++;
        while(P.tx<S.payP.length&&passed(S.payP[P.tx],ev,se))P.tx++;
        while(C.rx<S.payP.length&&passed(S.payP[C.rx],ev,se))C.rx++;
        if(se>1&&C.tx>=S.payC.length&&C.rx>=S.payP.length)break; // Central closes the event
        const ch=Math.floor(rnd()*37),rssi=-50-Math.floor(rnd()*10);
        // C→P
        const cp=C.tx<S.payC.length?S.payC[C.tx]:null,cLen=cp?LEN_C:0;
        let tC=anchor+(se-1)*opt.sub;
        if(tm.slot&&tm.slot[0]===se){tC+=tm.slot[1]/1000;}
        const cFail=!!(ij.cAll||(ij.cSe||[]).includes(se))||rnd()<opt.crc;
        const cSniff=opt.mismatch&&rnd()<opt.mismatch?!cFail:cFail;
        const oiC=push(tC,C2P,cis,ev,se,C.tx&1,C.rx&1,cp?0:1,ch,rssi,cSniff,cLen,cp?hex(cLen):'');
        if(cp){cp.txs++;if(cp.firstRow===null)cp.firstRow=oiC;}
        if(tm.slot&&tm.slot[0]===se&&oiC>=0)truth.timing.push({sid:cis,ec:ev,kind:'slotTiming',oi:oiC});
        if(ij.noRespAll||rnd()<opt.noResp)continue; // Peripheral missed the packet: no reply
        if(!cFail){
          if(cp&&(C.tx&1)===(P.rx&1)&&P.rx<S.payC.length){const q=S.payC[P.rx];q.delivered=true;q.okEv=ev;P.rx++;}
          if(P.tx<S.payP.length&&(C.rx&1)!==(P.tx&1))P.tx++; // Peripheral learns its payload was acked
        }
        // P→C
        const pp=P.tx<S.payP.length?S.payP[P.tx]:null,pLen=pp?LEN_P:0;
        let tP=tC+air(cLen)+0.150;
        if(tm.resp&&tm.resp[0]===se)tP+=tm.resp[1]/1000;
        const pFail=!!ij.pAll||rnd()<opt.crc;
        const pSniff=opt.mismatch&&rnd()<opt.mismatch?!pFail:pFail;
        const oiP=push(tP,P2C,cis,ev,se,P.tx&1,P.rx&1,pp?0:1,ch,rssi-3,pSniff,pLen,pp?hex(pLen):'');
        if(pp){pp.txs++;if(pp.firstRow===null)pp.firstRow=oiP;}
        if(tm.resp&&tm.resp[0]===se&&oiP>=0)truth.timing.push({sid:cis,ec:ev,kind:'slotTiming',oi:oiP});
        if(!pFail){
          if(pp&&(P.tx&1)===(C.rx&1)&&C.rx<S.payP.length){const q=S.payP[C.rx];q.delivered=true;q.okEv=ev;C.rx++;}
          if(C.tx<S.payC.length&&(P.rx&1)!==(C.tx&1))C.tx++; // Central learns its payload was acked
        }
      }
    });
  }
  return{headers:['Item','Timestamp','Direction','CIG ID','CIS ID','Event Counter','Subevent','SN','NESN','NPI','PHY','Channel','RSSI','CRC','Payload Length','Payload'],data:rows,truth,
    iso:{bnC:opt.bnC,ftC:opt.ftC,bnP:opt.bnP,ftP:opt.ftP}};
}

// ============================================================
//  EXPORT
// ============================================================
function exportReport(){
  const lines=[headers.join(',')];
  rawData.forEach((row,i)=>{const ex=errorRows.has(i)?' [ERROR]':gapRows.has(i)?` [GAP:${gapRows.get(i).missed}]`:'';lines.push(row.map(c=>`"${c}"`).join(',')+((ex)?`,"${ex}"`:''));});
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ellisys_report.csv';a.click();URL.revokeObjectURL(url);
}

// ============================================================
//  COLUMN MAPPING
//  Shows the auto-detected column for each field and lets the user correct it,
//  along with how Direction and CRC/Status values are read. Saved per header
//  set in localStorage, so the next file with the same columns reuses it.
// ============================================================
const MAP_FIELDS = [
  ['cisId','CIS ID','스트림 구분'], ['bisId','BIS ID','스트림 구분 (BIS)'],
  ['cigId','CIG ID','CIG가 여러 개일 때 구분'], ['bigHandle','BIG Handle','BIG가 여러 개일 때 구분'],
  ['direction','Direction','No Response, NACK, 방향별 집계'], ['eventCounter','Event Counter','대부분의 검사'],
  ['subevent','Subevent','Subevent Skip, ISO Event Grid'], ['sn','SN','NACK, 복구/손실 판정'], ['nesn','NESN','NACK, 복구/손실 판정'],
  ['npi','NPI','Null PDU 판정'], ['crc','CRC','Corrupted'], ['status','Status','Corrupted'],
  ['payloadLen','Payload Length','Payload 검사, Null PDU 판정'], ['payload','Payload (hex)','All-zero Payload'],
  ['channel','Channel','채널별 CRC 에러율'], ['rssi','RSSI','RSSI 히트맵'], ['timestamp','Timestamp','Timing 검사 (beta), Timeline RSSI/Channel'],
  ['item','Item (#)','이슈 목록 번호'],
];
const MAP_STORE = 'ellisysViewer.mapping:';
let mapDraft = null, mapDirVals = [], mapErrVals = {};

function mappingKey() { return MAP_STORE + headers.slice(0, baseColCount).join('\u0001'); }
function saveMapping() {
  const fields = Object.fromEntries(MAP_FIELDS.map(([k]) => [k, detectedFields[k] !== undefined ? headers[detectedFields[k]] : null]));
  try { localStorage.setItem(mappingKey(), JSON.stringify({ fields, dir: dirOverride, err: errOverride, iso: Object.fromEntries(ISO_SAVED.filter(k => isoUser[k] != null).map(k => [k, isoUser[k]])) })); } catch (e) {}
}
// Apply a saved mapping for this header set; returns false when there is none
function loadSavedMapping(keepIso) {
  let m;
  try { const v = localStorage.getItem(mappingKey()); if (!v) return false; m = JSON.parse(v); } catch (e) { return false; }
  MAP_FIELDS.forEach(([k]) => {
    if (!m.fields || !hasOwn(m.fields, k)) return;
    const i = m.fields[k] === null ? -1 : headers.indexOf(m.fields[k]);
    if (i < 0 || i >= baseColCount) delete detectedFields[k]; else detectedFields[k] = i;
  });
  dirOverride = m.dir || {}; errOverride = m.err || {}; dirCache.clear();
  if (keepIso === undefined) isoUser = Object.fromEntries(ISO_SAVED.filter(k => m.iso && m.iso[k] != null).map(k => [k, m.iso[k]]));
  return true;
}
function topValues(ci, n) {
  const c = new Map(); rawData.forEach(r => { const v = (r[ci] ?? '').trim(); c.set(v, (c.get(v) || 0) + 1); });
  return [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, n);
}

function openMapModal() {
  mapDraft = { fields: Object.fromEntries(MAP_FIELDS.map(([k]) => [k, detectedFields[k]])), dir: { ...dirOverride }, err: { ...errOverride } };
  renderMapBody();
  document.getElementById('mapModal').classList.add('open');
}
function closeMapModal() { document.getElementById('mapModal').classList.remove('open'); }

function renderMapBody() {
  const body = document.getElementById('mapBody'), F = mapDraft.fields;
  const sample = ci => { for (const r of rawData) { const v = r[ci]; if (v) return v.length > 40 ? v.slice(0, 40) + '…' : v; } return ''; };
  let h = '';
  if (F.eventCounter === undefined || (F.cisId === undefined && F.bisId === undefined))
    h += '<div class="warn">CIS/BIS ID와 Event Counter가 있어야 대부분의 검사가 동작합니다. 해당 컬럼을 지정해 주세요.</div>';
  h += '<table class="map-table"><thead><tr><th>필드</th><th>CSV 컬럼</th><th>예시 값</th><th>쓰이는 곳</th></tr></thead><tbody>';
  MAP_FIELDS.forEach(([k, label, use]) => {
    const cur = F[k];
    h += `<tr><td>${label}</td><td><select data-field="${k}"><option value="">(없음)</option>${headers.slice(0, baseColCount).map((hd, i) => `<option value="${i}"${cur === i ? ' selected' : ''}>${escHtml(hd)}</option>`).join('')}</select></td>`
      + `<td class="map-sample">${cur !== undefined ? escHtml(sample(cur)) : ''}</td><td class="map-use">${use}</td></tr>`;
  });
  h += '</tbody></table>';

  // How Direction values are read (sender side)
  mapDirVals = F.direction !== undefined ? topValues(F.direction, 8).filter(([v]) => v) : [];
  if (mapDirVals.length) {
    h += '<h3>Direction 값 → 송신 측</h3><div class="map-vals">' + mapDirVals.map(([v, c], i) => {
      const cur = hasOwn(mapDraft.dir, v) ? mapDraft.dir[v] : autoIsCtoP(v) ? 'c' : 'p';
      return `<label><span class="mv">${escHtml(v)}</span><span class="mc">${c}</span><select data-di="${i}"><option value="c"${cur === 'c' ? ' selected' : ''}>C→P (Central 송신)</option><option value="p"${cur === 'p' ? ' selected' : ''}>P→C (Peripheral 송신)</option></select></label>`;
    }).join('') + '</div>';
  }
  // Which CRC/Status values count as errors
  mapErrVals = {};
  [['crc', F.crc], ['status', F.status]].filter(([, ci]) => ci !== undefined).forEach(([kind, ci]) => {
    mapErrVals[kind] = topValues(ci, 12);
    h += `<h3>${escHtml(headers[ci])} 값 중 에러로 볼 것</h3><div class="map-vals">` + mapErrVals[kind].map(([v, c], i) => {
      const cur = hasOwn(mapDraft.err, v) ? mapDraft.err[v] : autoIsError(v, kind);
      return `<label><input type="checkbox" data-kind="${kind}" data-ei="${i}"${cur ? ' checked' : ''}><span class="mv">${escHtml(v || '(빈 값)')}</span><span class="mc">${c}</span></label>`;
    }).join('') + '</div>';
  });
  body.innerHTML = h;

  body.querySelectorAll('select[data-field]').forEach(s => s.onchange = () => { mapDraft.fields[s.dataset.field] = s.value === '' ? undefined : +s.value; renderMapBody(); });
  body.querySelectorAll('select[data-di]').forEach(s => s.onchange = () => { mapDraft.dir[mapDirVals[+s.dataset.di][0]] = s.value; });
  body.querySelectorAll('input[data-ei]').forEach(cb => cb.onchange = () => { mapDraft.err[mapErrVals[cb.dataset.kind][+cb.dataset.ei][0]] = cb.checked; });
}

document.getElementById('btnColumns').onclick = openMapModal;
document.getElementById('mapCancel').onclick = closeMapModal;
document.getElementById('mapReset').onclick = () => {
  const auto = detectFields(headers.slice(0, baseColCount));
  mapDraft = { fields: Object.fromEntries(MAP_FIELDS.map(([k]) => [k, auto[k]])), dir: {}, err: {} };
  renderMapBody();
};
document.getElementById('mapApply').onclick = () => {
  MAP_FIELDS.forEach(([k]) => { if (mapDraft.fields[k] === undefined) delete detectedFields[k]; else detectedFields[k] = mapDraft.fields[k]; });
  dirOverride = mapDraft.dir; errOverride = mapDraft.err; dirCache.clear();
  saveMapping(); closeMapModal(); runAnalysis();
};

// ============================================================
//  INIT
// ============================================================
// iso: ISO parameters to use instead of the saved ones (the samples pass their own)
function loadData(h,d,iso){
  // Rows must match the header length so derived columns line up
  d.forEach(r=>{while(r.length<h.length)r.push('');r.length=h.length;});
  headers=h;rawData=d;baseColCount=h.length;
  detectedFields=detectFields(headers);dirOverride={};errOverride={};dirCache.clear();
  isoUser=iso?{...iso}:{};
  loadSavedMapping(iso);
  document.getElementById('dropzone').classList.add('hidden');
  document.getElementById('mainView').classList.add('active');
  ['btnColumns','btnLoad','btnExport'].forEach(id=>document.getElementById(id).style.display='');
  runAnalysis();
  // Without a stream ID or Event Counter most checks can't run: ask for the mapping
  if(detectedFields.eventCounter===undefined||getStreamCol()===null)openMapModal();
}

// (Re)run every analysis from the current field mapping
function runAnalysis(){
  // Drop derived columns from a previous run before deriving them again
  if(headers.length>baseColCount){headers.length=baseColCount;rawData.forEach(r=>{r.length=baseColCount;});}
  columnFilters={};closeColFilter();sortCol=-1;issueSel=null;
  initStreams();analyzeErrors(rawData,detectedFields);analyzeIssues();appendDerivedColumns();
  filteredData=[...rawData];filteredData._origIndices=rawData.map((_,i)=>i);
  document.getElementById('filterErrorOnly').checked=false;document.getElementById('filterSearch').value='';
  document.getElementById('btnClearAllFilters').style.display='none';
  buildStreamBar();initFilterBar();renderTable();buildTimeline();
  switchTab('issues');
  document.getElementById('rowCount').textContent=`${filteredData.length} / ${rawData.length}`;
  console.log('Fields:',Object.entries(detectedFields).map(([k,v])=>`${k}:"${headers[v]}"`).join(', ')||'none');
}

// Tabs
document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>switchTab(tab.dataset.tab));});

// File handling
const dz=document.getElementById('dropzone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0]);});
document.getElementById('fileInput').addEventListener('change',e=>{if(e.target.files[0])readFile(e.target.files[0]);});
function readFile(f){const r=new FileReader();r.onload=e=>{const{headers:h,data:d}=parseCSV(e.target.result);if(h.length>0&&d.length>0)loadData(h,d);else alert('Could not parse CSV.');};r.readAsText(f);}
document.getElementById('btnSample').onclick=()=>{const{headers:h,data:d}=generateSampleData();loadData(h,d,{});};
document.getElementById('btnSample2').onclick=()=>{const{headers:h,data:d}=generateSampleData();loadData(h,d,{});};
const loadSampleFt=()=>{const g=generateSampleData2();loadData(g.headers,g.data,g.iso);};
document.getElementById('btnSampleFt').onclick=loadSampleFt;
document.getElementById('btnSampleFt2').onclick=loadSampleFt;
document.getElementById('btnLoad').onclick=()=>{document.getElementById('mainView').classList.remove('active');document.getElementById('dropzone').classList.remove('hidden');['btnColumns','btnLoad','btnExport'].forEach(id=>document.getElementById(id).style.display='none');};
document.getElementById('btnExport').onclick=exportReport;
window.addEventListener('resize',()=>{const at=document.querySelector('.tab.active');if(at){if(at.dataset.tab==='timeline')drawTimeline();if(at.dataset.tab==='issues'&&causeOpen)drawCause();}});
</script>
